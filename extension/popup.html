<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undertone</title><link rel="stylesheet" href="popup.css"></head><body><header><span class="logo">▥</span><strong>undertone.</strong><span>FISH AUDIO COMPANION</span></header><main><div class="section-header"><span>YOUR SELECTION</span><button id="capture">Capture text ↗</button></div><textarea id="selection" aria-label="Selected text" placeholder="Select words on a page, then capture them here. Or paste something worth hearing." maxlength="20000"></textarea><div class="meta"><span id="source">Waiting for your next good read.</span><span id="count">0 characters</span></div><div class="actions"><button id="listen" class="primary">▶ Listen</button><button id="studio">Open studio ↗</button><button id="stop" aria-label="Stop playback">■</button></div><p id="status" role="status"></p><details id="settings"><summary>Connection & settings <span>⌄</span></summary><label for="key">Fish Audio API key</label><input id="key" type="password" autocomplete="off" placeholder="Your API key"><small>Kept in browser session storage. Clears when the browser session ends.</small><label for="voice">Voice</label><select id="voice"><option value="c70cfb98867a4bfb9ae20d2401257b92">Delia</option><option value="bf322df2096a46f18c579d0baa36f41d">Adrian</option><option value="f3a2b90078d54a65af4b95f63bc7798e">Sheila</option><option value="custom">Custom voice ID</option></select><input id="custom-voice" placeholder="Fish Audio voice ID" aria-label="Custom voice ID" hidden><div class="setting-pair"><div><label for="model">Model</label><select id="model"><option value="drama-3">Drama 3</option><option value="s2.1-pro">S2.1 Pro</option><option value="s2.1-pro-free">S2.1 Pro Free</option></select></div><div><label for="speed">Speed</label><select id="speed"><option value="0.75">0.75×</option><option value="1">1.0×</option><option value="1.25">1.25×</option><option value
